<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог монет: от Анны Иоанновны до Раннего СССР</title>
    
    <style>
        /* ==========================================================================
           1. ПЕРЕМЕННЫЕ И БАЗОВЫЕ НАСТРОЙКИ
           ========================================================================== */
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-color: #d4af37; /* Золотой цвет */
            --accent-hover: #e6c250;
            --cell-bg: #21262d;
            --cell-hover: #30363d;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ==========================================================================
           2. ШАПКА САЙТА
           ========================================================================== */
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo span {
            font-size: 1.8rem;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* ==========================================================================
           3. НАВИГАЦИЯ ПО ПРАВИТЕЛЯМ
           ========================================================================== */
        .nav-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .nav-scroll {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding-bottom: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) var(--bg-color);
        }

        .nav-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .nav-scroll::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 10px;
        }

        .ruler-btn {
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .ruler-btn:hover {
            background-color: var(--cell-hover);
            border-color: var(--accent-color);
        }

        .ruler-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            font-weight: bold;
        }

        /* ==========================================================================
           4. СЕТКА МОНЕТ (12 ЯЧЕЕК)
           ========================================================================== */
        main {
            max-width: 1200px;
            margin: 0 auto 50px auto;
            padding: 0 15px;
        }

        .section-title {
            font-size: 1.4rem;
            color: var(--accent-color);
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .section-title span {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: normal;
        }

        .coins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        /* Карточка (ячейка) для монеты */
        .coin-cell {
            background-color: var(--cell-bg);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            padding: 15px;
            text-align: center;
        }

        .coin-cell:hover {
            background-color: var(--cell-hover);
            border-color: var(--accent-color);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.15);
        }

        .coin-cell.filled {
            border: 1px solid var(--accent-color);
            background: linear-gradient(145deg, #1c2128, #161b22);
        }

        .coin-number {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
            background-color: var(--bg-color);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .coin-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .coin-cell.filled .coin-icon {
            opacity: 1;
        }

        .coin-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            word-wrap: break-word;
            width: 100%;
        }

        .coin-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* ==========================================================================
           5. МОДАЛЬНОЕ ОКНО ДЛЯ РЕДАКТИРОВАНИЯ
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: var(--accent-color);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: var(--font-main);
        }

        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .btn-save {
            background-color: var(--accent-color);
            color: #000;
        }

        .btn-cancel {
            background-color: var(--cell-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        /* Адаптивность для очень маленьких экранов */
        @media (max-width: 400px) {
            .coins-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .coin-cell {
                height: 150px;
            }
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="logo"><span>🪙</span> Каталог монет</div>
        <div class="subtitle">От Анны Иоанновны до Раннего СССР</div>
    </header>

    <!-- Навигация -->
    <div class="nav-container">
        <div class="nav-scroll" id="ruler-nav">
            <!-- Кнопки правителей будут добавлены через JavaScript -->
        </div>
    </div>

    <!-- Основная зона контента -->
    <main>
        <div class="section-title" id="current-ruler-title">
            Выберите правителя <span id="ruler-years"></span>
        </div>
        
        <div class="coins-grid" id="coins-grid">
            <!-- 12 ячеек будут добавлены через JavaScript -->
        </div>
    </main>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="coin-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Монета №1</h3>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            
            <div class="input-group">
                <label>Название монеты</label>
                <input type="text" id="coin-name-input" placeholder="Например: 1 рубль 1730 года">
            </div>
            
            <div class="input-group">
                <label>Описание / Металл / Состояние</label>
                <textarea id="coin-desc-input" rows="3" placeholder="Серебро, XF..."></textarea>
            </div>
            
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeModal()">Отмена</button>
                <button class="btn btn-save" onclick="saveCoin()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           6. ДАННЫЕ О ПРАВИТЕЛЯХ (РОВНО 11 ШТУК)
           ========================================================================== */
        const rulers = [
            { id: "anna", name: "Анна Иоанновна", years: "1730–1740" },
            { id: "elizabeth", name: "Елизавета Петровна", years: "1741–1761" },
            { id: "catherine", name: "Екатерина Великая", years: "1762–1796" },
            { id: "paul", name: "Павел I", years: "1796–1801" },
            { id: "alex1", name: "Александр I", years: "1801–1825" },
            { id: "nich1", name: "Николай I", years: "1825–1855" },
            { id: "alex2", name: "Александр II", years: "1855–1881" },
            { id: "alex3", name: "Александр III", years: "1881–1894" },
            { id: "nich2", name: "Николай II", years: "1894–1917" },
            { id: "rsfsr", name: "РСФСР", years: "1917–1922" },
            { id: "ussr", name: "Ранний СССР", years: "1922–1930-е" }
        ];

        let activeRuler = rulers[0].id;
        let coinsData = {};
        let currentCellIndex = null;

        /* ==========================================================================
           7. ЛОГИКА РАБОТЫ
           ========================================================================== */

        function renderNav() {
            const navContainer = document.getElementById('ruler-nav');
            navContainer.innerHTML = '';

            rulers.forEach(ruler => {
                const btn = document.createElement('button');
                btn.className = `ruler-btn ${ruler.id === activeRuler ? 'active' : ''}`;
                btn.textContent = ruler.name;
                btn.onclick = () => selectRuler(ruler.id);
                navContainer.appendChild(btn);
            });
        }

        function selectRuler(rulerId) {
            activeRuler = rulerId;
            renderNav();
            updateTitle();
            renderGrid();
        }

        function updateTitle() {
            const ruler = rulers.find(r => r.id === activeRuler);
            document.getElementById('current-ruler-title').innerHTML = 
                `${ruler.name} <span id="ruler-years">${ruler.years}</span>`;
        }

        function renderGrid() {
            const grid = document.getElementById('coins-grid');
            grid.innerHTML = '';

            if (!coinsData[activeRuler]) {
                coinsData[activeRuler] = {};
            }

            for (let i = 1; i <= 12; i++) {
                const cellData = coinsData[activeRuler][i] || {};
                const isFilled = cellData.name && cellData.name.trim() !== '';

                const cell = document.createElement('div');
                cell.className = `coin-cell ${isFilled ? 'filled' : ''}`;
                cell.onclick = () => openModal(i);

                cell.innerHTML = `
                    <div class="coin-number">№${i}</div>
                    <div class="coin-icon">${isFilled ? '🪙' : '➕'}</div>
                    <div class="coin-title">${isFilled ? cellData.name : 'Добавить'}</div>
                    ${isFilled && cellData.desc ? `<div class="coin-desc">${cellData.desc}</div>` : ''}
                `;

                grid.appendChild(cell);
            }
        }

        function openModal(index) {
            currentCellIndex = index;
            const cellData = coinsData[activeRuler][index] || {};
            
            document.getElementById('modal-title').textContent = `Монета №${index}`;
            document.getElementById('coin-name-input').value = cellData.name || '';
            document.getElementById('coin-desc-input').value = cellData.desc || '';
            
            document.getElementById('coin-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('coin-modal').classList.remove('active');
            currentCellIndex = null;
        }

        function saveCoin() {
            const name = document.getElementById('coin-name-input').value.trim();
            const desc = document.getElementById('coin-desc-input').value.trim();

            if (name === '') {
                delete coinsData[activeRuler][currentCellIndex];
            } else {
                if (!coinsData[activeRuler][currentCellIndex]) {
                    coinsData[activeRuler][currentCellIndex] = {};
                }
                coinsData[activeRuler][currentCellIndex].name = name;
                coinsData[activeRuler][currentCellIndex].desc = desc;
            }

            closeModal();
            renderGrid();
        }

        document.getElementById('coin-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        window.onload = () => {
            renderNav();
            updateTitle();
            renderGrid();
        };
    </script>
</body>
</html>

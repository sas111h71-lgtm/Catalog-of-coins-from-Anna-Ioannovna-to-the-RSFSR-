<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Каталог монет</title>
    
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-color: #d4af37;
            --cell-bg: #21262d;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ШАПКА */
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px;
            text-align: center;
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 1.3rem; font-weight: bold; color: var(--accent-color); display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* НАВИГАЦИЯ */
        .nav-container { margin: 15px 0; padding: 0 10px; }
        .nav-scroll {
            display: flex; overflow-x: auto; gap: 8px; padding-bottom: 5px;
            scrollbar-width: none;
        }
        .nav-scroll::-webkit-scrollbar { display: none; }
        .ruler-btn {
            background-color: var(--panel-bg); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 8px 16px;
            border-radius: 20px; cursor: pointer; white-space: nowrap;
            font-size: 0.85rem; transition: all 0.2s ease;
        }
        .ruler-btn.active { background-color: var(--accent-color); color: #000; border-color: var(--accent-color); font-weight: bold; }

        /* СЕТКА */
        main { padding: 0 10px 80px 10px; }
        .section-title {
            font-size: 1.2rem; color: var(--accent-color); margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color); padding-bottom: 8px;
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .section-title span { font-size: 0.9rem; color: var(--text-muted); }
        
        .coins-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 600px) { .coins-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 900px) { .coins-grid { grid-template-columns: repeat(4, 1fr); } }

        /* ЯЧЕЙКА */
        .coin-cell {
            background-color: var(--cell-bg); border: 1px dashed var(--border-color);
            border-radius: 12px; height: 200px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
            position: relative; overflow: hidden; padding: 10px; text-align: center;
            transition: border 0.2s;
        }
        .coin-cell:active { transform: scale(0.98); }
        .coin-cell.filled { border: 1px solid var(--accent-color); background: linear-gradient(145deg, #1c2128, #161b22); }
        
        .coin-number { position: absolute; top: 8px; left: 8px; font-size: 0.7rem; color: var(--text-muted); background-color: var(--bg-color); padding: 2px 6px; border-radius: 8px; z-index: 2; }
        
        .coin-img { width: 100%; height: 100px; object-fit: contain; margin-bottom: 5px; background-color: #000; border-radius: 6px; }
        .coin-icon { font-size: 2rem; margin-bottom: 10px; opacity: 0.5; }

        .coin-title { font-size: 0.85rem; font-weight: 600; color: var(--accent-color); width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .coin-info { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; display: flex; flex-direction: column; gap: 2px;}

        /* МОДАЛЬНОЕ ОКНО */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.85); display: none;
            justify-content: center; align-items: flex-end; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        
        .modal-content {
            background-color: var(--panel-bg); border-top: 1px solid var(--border-color);
            border-radius: 20px 20px 0 0; width: 100%; max-width: 600px; 
            max-height: 90vh; overflow-y: auto; padding: 20px;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-header h3 { color: var(--accent-color); }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        
        .input-row { display: flex; gap: 10px; }
        .input-group { margin-bottom: 12px; flex: 1; }
        .input-group label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: var(--text-muted); }
        .input-group input, .input-group textarea {
            width: 100%; padding: 10px; background-color: var(--bg-color);
            border: 1px solid var(--border-color); border-radius: 8px;
            color: var(--text-main); font-family: var(--font-main); font-size: 0.9rem;
        }
        .input-group input:focus, .input-group textarea:focus { outline: none; border-color: var(--accent-color); }
        
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .file-upload-btn {
            border: 1px dashed var(--accent-color); color: var(--accent-color);
            padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.9rem;
        }
        .file-upload-wrapper input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        
        .image-preview { width: 100%; height: 150px; object-fit: contain; border-radius: 8px; margin-top: 10px; display: none; background-color: #000; }

        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn { padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; flex: 1; font-size: 1rem; }
        .btn-save { background-color: var(--accent-color); color: #000; }
        .btn-cancel { background-color: var(--cell-bg); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-delete { background-color: #da3633; color: white; flex: 0.5; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>🪙</span> Каталог монет</div>
    </header>

    <div class="nav-container">
        <div class="nav-scroll" id="ruler-nav"></div>
    </div>

    <main>
        <div class="section-title" id="current-ruler-title">Выберите правителя <span id="ruler-years"></span></div>
        <div class="coins-grid" id="coins-grid"></div>
    </main>

    <!-- Модальное окно редактирования -->
    <div class="modal-overlay" id="coin-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Монета №1</h3>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            
            <div class="input-group">
                <label>Фотография монеты</label>
                <div class="file-upload-wrapper">
                    <div class="file-upload-btn">📷 Нажмите, чтобы выбрать фото</div>
                    <input type="file" id="coin-image-input" accept="image/*">
                </div>
                <img id="image-preview" class="image-preview">
            </div>

            <div class="input-group">
                <label>Название / Номинал</label>
                <input type="text" id="coin-name-input" placeholder="Например: 1 рубль">
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label>Год</label>
                    <input type="text" id="coin-year-input" placeholder="1730">
                </div>
                <div class="input-group">
                    <label>Грейд</label>
                    <input type="text" id="coin-grade-input" placeholder="XF 45">
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label>Вес (г)</label>
                    <input type="text" id="coin-weight-input" placeholder="20.5">
                </div>
                <div class="input-group">
                    <label>Диаметр (мм)</label>
                    <input type="text" id="coin-diameter-input" placeholder="35">
                </div>
            </div>
            
            <div class="input-group">
                <label>Описание (необязательно)</label>
                <textarea id="coin-desc-input" rows="2" placeholder="Особенности, дефекты, металл..."></textarea>
            </div>
            
            <div class="modal-actions">
                <button class="btn btn-delete" onclick="deleteCoin()">Удалить</button>
                <button class="btn btn-cancel" onclick="closeModal()">Отмена</button>
                <button class="btn btn-save" onclick="saveCoin()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        // Список правителей
        const rulers = [
            { id: "anna", name: "Анна Иоанновна", years: "1730–1740" },
            { id: "elizabeth", name: "Елизавета Петровна", years: "1741–1761" },
            { id: "catherine", name: "Екатерина Великая", years: "1762–1796" },
            { id: "paul", name: "Павел I", years: "1796–1801" },
            { id: "alex1", name: "Александр I", years: "1801–1825" },
            { id: "nich1", name: "Николай I", years: "1825–1855" },
            { id: "alex2", name: "Александр II", years: "1855–1881" },
            { id: "alex3", name: "Александр III", years: "1881–1894" },
            { id: "nich2", name: "Николай II", years: "1894–1917" },
            { id: "rsfsr", name: "РСФСР", years: "1917–1922" },
            { id: "ussr", name: "Ранний СССР", years: "1922–1930-е" }
        ];

        let activeRuler = rulers[0].id;
        
        // Загрузка базы данных из памяти телефона (LocalStorage)
        let coinsDb = JSON.parse(localStorage.getItem('coinCatalogData')) || {};

        let currentCellId = null;
        let currentImageBase64 = "";

        // DOM Элементы
        const fileInput = document.getElementById('coin-image-input');
        const imagePreview = document.getElementById('image-preview');

        // Инициализация навигации
        function renderNav() {
            const navContainer = document.getElementById('ruler-nav');
            navContainer.innerHTML = '';
            rulers.forEach(ruler => {
                const btn = document.createElement('button');
                btn.className = `ruler-btn ${ruler.id === activeRuler ? 'active' : ''}`;
                btn.textContent = ruler.name;
                btn.onclick = () => selectRuler(ruler.id);
                navContainer.appendChild(btn);
            });
        }

        // Переключение правителя
        function selectRuler(rulerId) {
            activeRuler = rulerId;
            renderNav();
            const ruler = rulers.find(r => r.id === activeRuler);
            document.getElementById('current-ruler-title').innerHTML = `${ruler.name} <span>${ruler.years}</span>`;
            renderGrid();
        }

        // Отрисовка сетки ячеек
        function renderGrid() {
            const grid = document.getElementById('coins-grid');
            grid.innerHTML = '';

            for (let i = 1; i <= 12; i++) {
                const cellId = `${activeRuler}_${i}`;
                const data = coinsDb[cellId];
                const isFilled = data && data.name;

                const cell = document.createElement('div');
                cell.className = `coin-cell ${isFilled ? 'filled' : ''}`;
                cell.onclick = () => openModal(cellId, i);

                if (isFilled) {
                    cell.innerHTML = `
                        <div class="coin-number">№${i}</div>
                        ${data.image ? `<img src="${data.image}" class="coin-img">` : '<div class="coin-icon">🪙</div>'}
                        <div class="coin-title">${data.name}</div>
                        <div class="coin-info">
                            <span>${data.year ? data.year + ' г.' : ''} ${data.grade ? ' | ' + data.grade : ''}</span>
                        </div>
                    `;
                } else {
                    cell.innerHTML = `
                        <div class="coin-number">№${i}</div>
                        <div class="coin-icon">➕</div>
                        <div class="coin-title" style="color:var(--text-muted)">Добавить</div>
                    `;
                }
                grid.appendChild(cell);
            }
        }

        // Открытие окна
        function openModal(cellId, index) {
            currentCellId = cellId;
            const data = coinsDb[cellId] || {};
            
            document.getElementById('modal-title').textContent = `Монета №${index}`;
            document.getElementById('coin-name-input').value = data.name || '';
            document.getElementById('coin-year-input').value = data.year || '';
            document.getElementById('coin-grade-input').value = data.grade || '';
            document.getElementById('coin-weight-input').value = data.weight || '';
            document.getElementById('coin-diameter-input').value = data.diameter || '';
            document.getElementById('coin-desc-input').value = data.desc || '';
            
            currentImageBase64 = data.image || "";
            if (currentImageBase64) {
                imagePreview.src = currentImageBase64;
                imagePreview.style.display = 'block';
            } else {
                imagePreview.style.display = 'none';
                imagePreview.src = '';
            }
            fileInput.value = '';

            document.getElementById('coin-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('coin-modal').classList.remove('active');
            currentCellId = null;
        }

        // Конвертация фото в Base64 (для сохранения в память)
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    // Сжимаем фото перед сохранением
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        currentImageBase64 = canvas.toDataURL('image/jpeg', 0.7); // Сжатие 70%
                        imagePreview.src = currentImageBase64;
                        imagePreview.style.display = 'block';
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Сохранение
        function saveCoin() {
            const name = document.getElementById('coin-name-input').value.trim();
            
            if (name === '') {
                alert("Введите хотя бы название монеты!");
                return;
            }

            coinsDb[currentCellId] = {
                name: name,
                year: document.getElementById('coin-year-input').value.trim(),
                grade: document.getElementById('coin-grade-input').value.trim(),
                weight: document.getElementById('coin-weight-input').value.trim(),
                diameter: document.getElementById('coin-diameter-input').value.trim(),
                desc: document.getElementById('coin-desc-input').value.trim(),
                image: currentImageBase64
            };

            // Сохраняем в память телефона
            localStorage.setItem('coinCatalogData', JSON.stringify(coinsDb));
            
            closeModal();
            renderGrid();
        }

        // Удаление
        function deleteCoin() {
            if (confirm("Удалить эту монету из каталога?")) {
                delete coinsDb[currentCellId];
                localStorage.setItem('coinCatalogData', JSON.stringify(coinsDb));
                closeModal();
                renderGrid();
            }
        }

        // Запуск
        window.onload = () => {
            selectRuler(rulers[0].id);
        };
    </script>
</body>
</html>
